<html lang="en">
  
<head>
  <script src="transition.js" defer></script>

  <meta charset="UTF-8">
  <title>Happy Birthday, My Love, scroll down</title>
  <link rel="stylesheet" href="transition.css">
<script src="transition.js" defer></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    .parallax-section {
      position: relative;
      height: 100vh;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
      font-size: 2em;
      text-align: center;
    }

.section1 {
      background-image: url('dreamy sky.jpeg');
    }

    .section2 {
      background-image: url('roses.jpg');
    }

    .section3 {
      background-image: url('Lates_chusti.jpg');
    }

    .section4 {
      background-image: url('Screenshot 2025-08-28 023049.png');
    }

    .message {
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
      max-width: 80%;
    }
    .top-left-button {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 1000;
}

.top-left-button a {
  background-color: #000000;
  color: white;
  padding: 10px 20px;
  text-decoration: none;
  font-size: 1em;
  border-radius: 6px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  transition: background 0.3s ease, transform 0.2s ease;
}

.top-left-button a:hover {
  background-color: #000000;
  transform: scale(1.05);
  
}
.top-right-button {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 1000;
}

.top-right-button a {
  background-color: #000000;
  color: white;
  padding: 10px 20px;
  text-decoration: none;
  font-size: 1em;
  border-radius: 6px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  transition: background 0.3s ease, transform 0.2s ease;
}

.top-right-button a:hover {
  background-color: #3a3333;
  transform: scale(1.05);
}
  </style>
</head>
<body>

  <div class="parallax-section section1">
    <div class="message">Happy Birthday, My Universe 🌌</div>
  </div>

  <div class="parallax-section section2">
    <div class="message">Every petal reminds me of your kindness 🌹</div>
  </div>

  <div class="parallax-section section3">
    <div class="message">Here's to all our beautiful memories 💖Cheers</div>
  </div>

  <div class="parallax-section section4">
    <div class="message"> Thank you for being there of me (^///^)</div>
  </div>

  <div class="top-right-button">
  <a href="pussles.html">Next Page</a>
</div>
<div class="top-left-button">
  <a href="star.html">Previous Page</a>
</div>
</body>
</html>
